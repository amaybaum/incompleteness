name: retention tests

# Dispatch-only. Runs the evidence-retention archive's release-gate step and its tree-mode checks
# (verification/audits/evidence-retention/, AGENTS §A.42) on the dispatched ref, and optionally a bounded
# mutation campaign against them, so that these batteries, which take ten to twenty minutes each and
# are repeated on every revision, run in CI instead of on a session's disk (AGENTS §A.40). Dispatching it
# is governed by §A.40 and §A.43 item 4.
#
# Jobs, in order:
#   plan      refuses a ref outside the allow-list below, and a ref whose copy of this workflow, the
#             runner (tools/retention_mutant_run.sh) or the classifier (tools/mutant_verdict.py) differs
#             from main's; runs the classifier's self-test; validates the optional mutant list.
#   controls  live controls on real tool output, through the same runner and classifier the mutants use:
#             the unmodified comparator self-test must be SURVIVED; a one-line mutation of it KILLED with
#             its target and NOT-TARGETED with an unrelated one; an injected crash in compare_result.py and
#             one in check_objects.py CRASHED.
#   checks    `gate` (check_retention.py --gate, the release-gate step: history mode, the self-test, the
#             retained objects' --reconstitute and --self-test, and the job-output comparator's self-test),
#             plus the two tree-mode checks the gate does not run, `retention` and `objects`.
#   mutants   one job per mutant, only after plan, controls and every check have passed: copy the runner
#             and classifier aside, apply the patch, run its check, and classify. The job passes only for
#             KILLED. See tools/mutant_verdict.py for the verdicts and how `expect` is matched.
#
# The mutant list is a JSON file on the dispatched ref, at the path given as the `mutants` input:
#   {"mutants": [{"id": "no-build-check", "patch": "no-build-check.patch", "check": "tools-self-test",
#                 "expect": "an expected result recording no successful build (C1)"}]}
# `patch` is relative to the JSON file's directory. `check` is one of gate, retention, retention-self-test,
# objects, objects-reconstitute, objects-self-test, tools-self-test. `expect` names the targeted failing
# case exactly as printed, rule tag included (self-test checks), or a fragment of the targeted failure
# message (the other checks).
#
# Limits enforced here: refs refs/heads/{claude,staging,retention,review,wip}/... only (never main, round
# branches or special launch branches); one run at a time per ref; at most 4 jobs of a matrix at once;
# at most 12 mutants; 30 minutes per check or mutant job, each check bounded by a 27-minute timeout.
# Worst case for one attempt:
# 5 + 10 + 3 x 30 + 12 x 30 = 465 runner-minutes. Measured locally, the gate takes 17 to 19 minutes and
# the self-tests 9 to 11. Not enforced here, and part of the dispatch policy: how many refs run at once,
# and re-running a failed job at most once and only for an infrastructure failure.
#
# The comparison with main's workflow, runner and classifier catches a branch carrying stale copies. It
# cannot bind a branch that edits them on purpose, since the branch's own copy of this file runs; that is
# caught by the owner's approval of the dispatch (§A.43 item 4). The classifier and the mutant-list
# validator run with `python3 -I`, so a module added to the branch cannot shadow one they import.
#
# Limit of the mutant isolation: the runner and classifier are copied aside before the patch is applied,
# but the patched check then runs as code in the same job and could in principle overwrite them. The
# mutant's author is the executor whose work is under review, so mutant lists are reviewed with the work.
#
# A run of this workflow is evidence for the executor. It is not an F/E `check-run` attestation
# (AGENTS §A.39), which only `verify` dispatched on exactly F or E provides.

on:
  workflow_dispatch:
    inputs:
      mutants:
        description: 'optional: path on the dispatched ref of a mutants JSON file (at most 12 mutants)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: retention-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Refuse a ref outside the allow-list
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/claude/*|refs/heads/staging/*|refs/heads/retention/*|refs/heads/review/*|refs/heads/wip/*) ;;
            *) echo "retention-tests runs only on development and review branches, not on $REF"; exit 1 ;;
          esac
          echo "ref $REF allowed"

      - uses: actions/checkout@v4

      # A branch carries its own copy of this workflow, so its limits are only those of main's copy if the
      # files are main's.
      - name: Require main's workflow, runner and classifier
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin main
          for f in .github/workflows/retention-tests.yml tools/retention_mutant_run.sh tools/mutant_verdict.py; do
            if ! git diff --quiet FETCH_HEAD -- "$f"; then
              echo "$f differs from main's; reconcile the branch with main before dispatching"
              exit 1
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Classifier self-test
        run: python3 -I -B tools/mutant_verdict.py --self-test

      # The input reaches the script only as an environment variable and is validated before use.
      - name: Validate the mutant list
        id: plan
        env:
          MUTANTS: ${{ inputs.mutants }}
        run: |
          python3 -I -B - <<'EOF'
          import importlib.util, json, os, posixpath, re, sys
          spec = importlib.util.spec_from_file_location('mutant_verdict', 'tools/mutant_verdict.py')
          mv = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mv)
          expect_problem = mv.expect_problem
          SAFE = re.compile(r'^[A-Za-z0-9._/-]+$')
          path = os.environ.get('MUTANTS', '')
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          def fail(msg):
              print('mutant list rejected: ' + msg)
              sys.exit(1)
          def safe(p):
              return bool(SAFE.match(p)) and not p.startswith('/') and '..' not in p.split('/')
          if not path:
              out.write('count=0\nmatrix={"include":[]}\n')
              print('no mutants: checks and controls only')
              sys.exit(0)
          if not safe(path) or not path.endswith('.json') or not os.path.isfile(path):
              fail('%r is not a repository-relative .json file on this ref' % path)
          try:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
          except (OSError, ValueError) as e:
              fail('%s is not valid JSON: %s' % (path, e))
          ms = data.get('mutants') if isinstance(data, dict) else None
          if not isinstance(ms, list) or not 1 <= len(ms) <= 12:
              fail('"mutants" must be a list of 1 to 12 entries')
          base, seen, rows = posixpath.dirname(path), set(), []
          for m in ms:
              if not isinstance(m, dict) or set(m) != {'id', 'patch', 'check', 'expect'}:
                  fail('each mutant is an object with exactly the keys id, patch, check and expect')
              mid, patch, check, expect = m['id'], m['patch'], m['check'], m['expect']
              if not isinstance(mid, str) or not re.match(r'^[A-Za-z0-9._-]{1,64}$', mid) or mid in seen:
                  fail('bad or duplicate id %r' % (mid,))
              seen.add(mid)
              why = expect_problem(check, expect)
              if why:
                  fail('%s: %s' % (mid, why))
              full = posixpath.normpath(posixpath.join(base, patch)) if isinstance(patch, str) else ''
              if not isinstance(patch, str) or not safe(patch) or not safe(full) or not os.path.isfile(full):
                  fail('%s: patch %r is not a file next to the mutant list' % (mid, patch))
              rows.append({'id': mid, 'patch': full, 'check': check, 'expect': expect})
          out.write('count=%d\nmatrix=%s\n' % (len(rows), json.dumps({'include': rows})))
          print('%d mutant(s) planned' % len(rows))
          EOF

  controls:
    name: Classifier controls
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The targeted mutation renames one comparator message, which fails exactly the comparator self-test
      # case that looks for that message.
      - name: Live controls
        run: |
          set -u
          set +e
          d=verification/audits/evidence-retention
          log="$RUNNER_TEMP/control.log"
          target='an expected result recording no successful build (C1)'
          other='a reproduction whose build failed (C1)'
          want() {  # want VERDICT CHECK EXPECT
            got=$(bash tools/retention_mutant_run.sh "$2" "$3" "$log" tools/mutant_verdict.py | tail -n 1 | cut -d' ' -f1)
            if [ "$got" = "$1" ]; then echo "control OK: $2 -> $1"; else echo "control FAILED: $2 wanted $1, got $got"; tail -n 20 "$log"; exit 1; fi
          }
          want SURVIVED tools-self-test "$target"
          grep -c "F('C1 the expected result does not record a successful build')" "$d/compare_result.py" | grep -qx 1 \
            || { echo "control mutation site is not unique"; exit 1; }
          sed -i "s/F('C1 the expected result does not record a successful build')/F('C1 the expected result does not record a build')/" "$d/compare_result.py"
          [ -n "$(git status --porcelain)" ] || { echo "control mutation changed nothing"; exit 1; }
          want KILLED tools-self-test "$target"
          want NOT-TARGETED tools-self-test "$other"
          git checkout -- "$d/compare_result.py"
          sed -i "1i raise RuntimeError('mutant control: crash')" "$d/compare_result.py"
          want CRASHED tools-self-test "$target"
          git checkout -- "$d/compare_result.py"
          sed -i "1i raise RuntimeError('mutant control: crash')" "$d/check_objects.py"
          want CRASHED objects 'mutant control message'
          git checkout -- "$d/check_objects.py"
          [ -z "$(git status --porcelain)" ] || { echo "controls left the tree modified"; exit 1; }

  checks:
    name: ${{ matrix.check }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        check: [gate, retention, objects]
    steps:
      # Full history: the gate's history mode and the objects' reconstitution read git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: bash tools/retention_mutant_run.sh "$CHECK" - "$RUNNER_TEMP/check.log"

  mutants:
    name: mutant ${{ matrix.id }}
    needs: [plan, controls, checks]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply the mutant
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          set -eu
          cp -- tools/mutant_verdict.py "$RUNNER_TEMP/mutant_verdict.py"
          cp -- tools/retention_mutant_run.sh "$RUNNER_TEMP/retention_mutant_run.sh"
          cp -- "$PATCH" "$RUNNER_TEMP/mutant.patch"
          git apply --check "$RUNNER_TEMP/mutant.patch"
          git apply "$RUNNER_TEMP/mutant.patch"
          if [ -z "$(git status --porcelain)" ]; then echo "the patch changed nothing"; exit 1; fi
          git status --short

      - name: Run ${{ matrix.check }} and classify
        env:
          CHECK: ${{ matrix.check }}
          EXPECT: ${{ matrix.expect }}
        run: bash "$RUNNER_TEMP/retention_mutant_run.sh" "$CHECK" "$EXPECT" "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/mutant_verdict.py"
