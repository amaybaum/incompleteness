name: reproduce evidence

# Reproduces one archived expected result of verification/audits/evidence-retention/ (AGENTS §A.42):
# checks out the attested commit, rebuilds the Mathlib bridge and runs the release gate there, extracts the
# same structured result the archive holds, and compares the two. The verifier (the archive's manifest,
# reproduce.py, extract_result.py and compare_result.py) is read from the ref this workflow runs on; the
# historical commit supplies only the sources, the toolchain pin and its own tools/release_gate.py.
#
# Deliberately not cached: the historical build starts from Mathlib's cache alone, so the verdict never
# depends on what a previous run left behind. A cache miss costs time, never correctness.
#
# The inputs reach the shell only as environment variables, and are validated before use: run_id as a decimal
# run id, override_sha as a full 40-hex commit id, kind as one of its values. reproduce.py and job_outputs.py
# validate them again.
#
# kind selects the job. bridge (the default) runs the job `reproduce` below, unchanged: a tranche-1 entry
# ci-<run_id>, with reproduce.py. gate and guard run the job `reproduce-job-output`: one output of that kind of a
# tranche-3 entry run-<run_id>, with job_outputs.py reproduce --kind, after check_retention.py has checked the
# archive (R12's pins included). Negative controls (override_sha, expect_failure) are for bridge entries only.
#
# The job-output job pins its runner OS and Python. `runs-on: ubuntu-24.04` pins the OS release (the family), not
# the runner image build, which GitHub moves under the label. No container image is used: the guard's comparison
# rests on a pinned CPython (actions/setup-python's 3.11.16 build) and pinned numpy and scipy wheels, which carry
# their own libraries, and job_outputs.py checks the interpreter's versions against the recipe's recorded
# environment before it runs the probe, so a drift there fails closed by name; what the image still supplies (git,
# the shell, glibc) does not enter the compared output. The gate kind runs the historical tools/release_gate.py
# under Python 3.12.3, the system Python of Ubuntu 24.04, on which the original bridge job ran its gate.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'the archived run to reproduce, a decimal run id: with kind bridge, an entry ci-<run_id> of the manifest; with kind gate or guard, an entry run-<run_id>'
        required: true
      override_sha:
        description: 'NEGATIVE CONTROL ONLY: build this full commit id against the entry''s expected result; the control passes only on a scientific mismatch after a complete, passing build and gate'
        required: false
        default: ''
      expect_failure:
        description: 'NEGATIVE CONTROL ONLY: text one of the comparison failures must contain'
        required: false
        default: ''
      kind:
        description: 'bridge: a tranche-1 entry ci-<run_id> (reproduce.py); gate or guard: that output of a tranche-3 entry run-<run_id> (job_outputs.py reproduce --kind)'
        required: false
        type: choice
        options:
          - bridge
          - gate
          - guard
        default: bridge

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce
    if: inputs.kind == 'bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reproduce the expected result
        env:
          RUN_ID: ${{ inputs.run_id }}
          OVERRIDE_SHA: ${{ inputs.override_sha }}
          EXPECT_FAILURE: ${{ inputs.expect_failure }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "run_id must be a decimal run id"; exit 1; }
          args=(--run "$RUN_ID" --work "$RUNNER_TEMP/reproduce")
          if [ -n "$OVERRIDE_SHA" ]; then
            [[ "$OVERRIDE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "override_sha must be a full 40-hex commit id"; exit 1; }
            args+=(--override-sha "$OVERRIDE_SHA" --expect-scientific-mismatch)
            if [ -n "$EXPECT_FAILURE" ]; then args+=(--expect-failure "$EXPECT_FAILURE"); fi
          elif [ -n "$EXPECT_FAILURE" ]; then
            echo "expect_failure is for negative controls only"; exit 1
          fi
          python3 -I verification/audits/evidence-retention/reproduce.py "${args[@]}"

      - name: Comparator self-test (negative controls)
        if: always()
        run: python3 -I verification/audits/evidence-retention/compare_result.py --self-test

      - name: Keep the reproduction's log, extraction and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-evidence
          path: |
            ${{ runner.temp }}/reproduce/build-and-gate.log
            ${{ runner.temp }}/reproduce/reproduced.json
            ${{ runner.temp }}/reproduce/verdict.json
            ${{ runner.temp }}/reproduce/verdict.txt
          if-no-files-found: ignore

  reproduce-job-output:
    name: Reproduce a job output
    if: inputs.kind == 'gate' || inputs.kind == 'guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the recorded Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.kind == 'guard' && '3.11.16' || '3.12.3' }}

      - name: Install the guard's recorded environment
        if: inputs.kind == 'guard'
        run: python3 -m pip install numpy==2.4.6 scipy==1.17.1

      - name: Install elan
        if: inputs.kind == 'gate'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the archive
        run: python3 -I verification/audits/evidence-retention/check_retention.py

      - name: Reproduce the job output
        env:
          RUN_ID: ${{ inputs.run_id }}
          KIND: ${{ inputs.kind }}
          OVERRIDE_SHA: ${{ inputs.override_sha }}
          EXPECT_FAILURE: ${{ inputs.expect_failure }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "run_id must be a decimal run id"; exit 1; }
          [[ "$KIND" == gate || "$KIND" == guard ]] || { echo "kind must be gate or guard"; exit 1; }
          if [ -n "$OVERRIDE_SHA$EXPECT_FAILURE" ]; then echo "negative controls are for bridge entries only"; exit 1; fi
          python3 -I verification/audits/evidence-retention/job_outputs.py reproduce --run "$RUN_ID" --work "$RUNNER_TEMP/reproduce" --kind "$KIND"

      - name: Job-output comparator self-test
        if: always()
        run: python3 -I verification/audits/evidence-retention/job_outputs.py --self-test

      - name: Keep the reproduction's outputs and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-job-output
          path: |
            ${{ runner.temp }}/reproduce/verdict.json
            ${{ runner.temp }}/reproduce/output-*.txt
            ${{ runner.temp }}/reproduce/before-*.txt
          if-no-files-found: ignore
