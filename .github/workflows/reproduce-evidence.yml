name: reproduce evidence

# Reproduces one archived expected result of verification/audits/evidence-retention/ (AGENTS §A.42):
# checks out the attested commit, rebuilds the Mathlib bridge and runs the release gate there, extracts the
# same structured result the archive holds, and compares the two. The verifier (the archive's manifest,
# reproduce.py, extract_result.py and compare_result.py) is read from the ref this workflow runs on; the
# historical commit supplies only the sources, the toolchain pin and its own tools/release_gate.py.
#
# Deliberately not cached: the historical build starts from Mathlib's cache alone, so the verdict never
# depends on what a previous run left behind. A cache miss costs time, never correctness.
#
# The inputs reach the shell only as environment variables, and are validated before use: run_id as a decimal
# run id, override_sha as a full 40-hex commit id. reproduce.py validates them again.

# DISPOSABLE PROOF VARIANT for PR #852. A dispatch-only workflow cannot be dispatched before it exists on main,
# so this branch runs the same job on push, as two controls. The archive, the verifier and the reproduce step are
# those of 83312b51; the step reads the matrix where the real workflow reads its dispatch inputs. Only the
# trigger, the matrix and the final prediction check differ.
#   positive: run 38855576525, BG-3's E at 194eb3fd. Must hold: every command succeeds, no comparison failure.
#   negative: the same expected result built at BG-3's F, 777ddf8d. Must hold as a negative control (build and
#     gate pass at F; every failure scientific), and its failures must be exactly the three predicted from F's
#     own archived check run (38854027737) and its source: the lean-axioms count 5988 against 5989; the module's
#     7 #print axioms lines against the 8 recorded; real_to_integer_surrogate missing.
on:
  push:
    branches: ['tmp/r1-reproduce-proof-*']

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.control }} control, run ${{ matrix.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - control: positive
            run_id: '38855576525'
            override_sha: ''
            expect_failure: ''
          - control: negative
            run_id: '38855576525'
            override_sha: '777ddf8dcada759b5f3bcab26a4ff3833ba720bf'
            expect_failure: 'expected report of OIBridge.ScopeTransfer.real_to_integer_surrogate is missing'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reproduce the expected result
        env:
          RUN_ID: ${{ matrix.run_id }}
          OVERRIDE_SHA: ${{ matrix.override_sha }}
          EXPECT_FAILURE: ${{ matrix.expect_failure }}
        run: |
          set -eu
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "run_id must be a decimal run id"; exit 1; }
          args=(--run "$RUN_ID" --work "$RUNNER_TEMP/reproduce")
          if [ -n "$OVERRIDE_SHA" ]; then
            [[ "$OVERRIDE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "override_sha must be a full 40-hex commit id"; exit 1; }
            args+=(--override-sha "$OVERRIDE_SHA" --expect-scientific-mismatch)
            if [ -n "$EXPECT_FAILURE" ]; then args+=(--expect-failure "$EXPECT_FAILURE"); fi
          elif [ -n "$EXPECT_FAILURE" ]; then
            echo "expect_failure is for negative controls only"; exit 1
          fi
          python3 -I verification/audits/evidence-retention/reproduce.py "${args[@]}"

      - name: Check the verdict against the prediction
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          python3 -I - "$RUNNER_TEMP/reproduce/verdict.json" <<'EOF'
          import json, os, sys
          v = json.load(open(sys.argv[1]))
          base = v['commands_ok'] and v['build_success'] and v['gate_pass'] and v['holds']
          if os.environ['CONTROL'] == 'positive':
              ok = base and not v['negative_control'] and v['failures'] == []
          else:
              m = 'C3 OIBridge/TurnpikeScopeTransfer.lean: '
              predicted = [
                  ("C2 gate step lean-axioms differs: reproduced PASS 'lean_axiom_check: OK (5988 named result(s)",
                   "expected PASS 'lean_axiom_check: OK (5989 named result(s)"),
                  (m + "the expected result's #print axioms lines differ from the source at the commit (7 there)",),
                  (m + 'expected report of OIBridge.ScopeTransfer.real_to_integer_surrogate is missing from the reproduction',),
              ]
              hit = [[p for p in predicted if all(t in f for t in p)] for f in v['failures']]
              ok = (base and v['negative_control'] and v['control_problems'] == [] and len(v['failures']) == 3
                    and all(len(h) == 1 for h in hit) and sorted(map(str, (h[0] for h in hit))) == sorted(map(str, predicted)))
          for f in v['failures']:
              print('failure:', f)
          print('PREDICTION %s for the %s control' % ('MET' if ok else 'NOT MET', os.environ['CONTROL']))
          sys.exit(0 if ok else 1)
          EOF

      - name: Comparator self-test (negative controls)
        if: always()
        run: python3 -I verification/audits/evidence-retention/compare_result.py --self-test

      - name: Keep the reproduction's log, extraction and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-${{ matrix.control }}-${{ matrix.run_id }}
          path: |
            ${{ runner.temp }}/reproduce/build-and-gate.log
            ${{ runner.temp }}/reproduce/reproduced.json
            ${{ runner.temp }}/reproduce/verdict.json
            ${{ runner.temp }}/reproduce/verdict.txt
          if-no-files-found: ignore
