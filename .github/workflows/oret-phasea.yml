name: O-RET Phase A

# O-RET Phase A (verification/programmes/oi-qm/reconstruction/o-ret-routes-20261103/PREREG-PHASE-A.md,
# frozen at F below). workflow_dispatch only: there is no push or pull_request trigger, so no push
# launches it. A dispatch is a special launch and needs separate owner approval (AGENTS.md §A.43
# item 4; PREREG §7). One job, one pass, no retries, no inputs.
#
# The job conclusion carries the verdict (§A.44; PREREG §4 "PASS"): it is success only if
#   - this is the run's first attempt (marker),
#   - the check step (the run) exits 0,
#   - the regeneration step rebuilds verdict_text from summary.json byte for byte and re-applies
#     §4 to every per-tuple record without disagreement, and
#   - summary.json has verdict PASS (marker).
# The result reviewer reads the job conclusion from the host's API and applies the four-signal PASS.
# out/ (summary.json, one JSON file per tuple, check.json) is uploaded on every outcome.
# Actions are pinned by commit, with the pins used in pe01-bounded-tests.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oret-phasea
  cancel-in-progress: false

env:
  PHASEA_F: 49f0bd41c5323d2191b580460c8703740dd01b30
  TOOL: verification/programmes/oi-qm/reconstruction/o-ret-routes-20261103/phaseA/phasea.py
  PYTHON_VERSION: "3.12"

jobs:
  phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Marker - this is the run's first attempt (one pass, no rerun within the freeze)
        run: test "${{ github.run_attempt }}" = "1"
      - name: Byte-compile the tool
        run: python3 -m py_compile "$TOOL"
      - name: Self-test (synthetic cases only)
        run: python3 -I -B "$TOOL" --self-test
      - name: Verify the four frozen inputs against their git blob ids at F
        run: python3 -I -B "$TOOL" --verify-inputs --expect-F "$PHASEA_F"
      - name: Phase A check (the preregistered run)
        id: run
        run: python3 -I -B "$TOOL" --run --out out --expect-F "$PHASEA_F"
      - name: Regenerate verdict_text from summary.json and re-apply section 4 to every record
        if: always() && steps.run.outcome != 'skipped'
        run: python3 -I -B "$TOOL" --check-summary out --expect-F "$PHASEA_F"
      - name: Marker - summary.json has verdict PASS
        if: always() && steps.run.outcome != 'skipped'
        run: |
          python3 -I -B -c "import json, sys; s = json.load(open('out/phase-a/summary.json')); print(s['verdict'], s['exit']); sys.exit(0 if s['verdict'] == 'PASS' and s['exit'] == 0 else 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: oret-phasea-out
          path: out/
          retention-days: 90
          if-no-files-found: warn
