name: bridge compatibility research

# Replay of exploratory evidence only; no native round designation or receipt.
on:
  push:
    branches: [research/bridge-compatibility-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic dependency
        run: python -m pip install sympy==1.14.0
      - name: Verify saved record digests
        run: sha256sum -c verification/programmes/oi-qm/reconstruction/bridge-compatibility-audit/SHA256SUMS
      - name: Replay both implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          p = Path('verification/programmes/oi-qm/reconstruction/bridge-compatibility-audit')
          for script, saved in [('independent_check.py', 'independent-output.txt'), ('probe.py', 'original-output.txt')]:
              result = subprocess.run([sys.executable, '-I', '-B', str(p / script)], check=True, capture_output=True)
              if result.stderr or result.stdout != (p / saved).read_bytes():
                  raise SystemExit(f'Failed saved-output comparison: {script}')
              print(result.stdout.decode(), end='')
          PY
      - name: Check artifact placement
        run: python tools/artifact_placement_check.py
