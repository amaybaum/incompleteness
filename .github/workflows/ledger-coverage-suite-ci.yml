              ('C12', CC, [("    def entry(self, d, extra=(), flags=('-I', '-S', '-B'), out_name='out'):",
                            "    def entry(self, d, extra=(), flags=('-I', '-B'), out_name='out'):"),
                           ("    code6, res6, err6 = e.entry(d6, flags=('-I', '-S', '-B', '-v'))",
                            "    code6, res6, err6 = e.entry(d6, flags=('-I', '-B', '-v'))")],
