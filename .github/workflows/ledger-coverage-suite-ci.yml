name: ledger coverage suite CI validation (disposable)
# A disposable validation workflow for the ledger coverage tool at the reviewed commit T =
# 4f4a9d58fd0bf41289a4904c9b39c00c711c9093. It exists only on the branch ci/ledger-coverage-suite-4f4a9d58,
# runs on a push to that branch, and is not for merge.
#
# The suite runs in a detached worktree whose HEAD is T itself (not this commit, whose workflow file is not a
# pinned tool file), checked clean, over the full history fetched by the checkout. The staged A1 configuration is
# embedded below (gzip, base64) and used only after its sha256 is verified; the mutation harness is embedded
# byte-identical to the local harness and verified by sha256 before use.
#
# Steps: the local reproduction's steps 1-7 (the entry point's self-test with -I -S -B, the staged purity lint, the
# synthetic fixture, the conformance controls, the A1 conformance, the A1 controls without --main and with --main,
# the release gate), Y8 (the A1 and the synthetic configuration run in this one job by the same engine blob, through
# the A1 runner's --syn-engine flag), and the mutation run of the sets c1, c2, v60e and cache. The release gate runs
# last, after the Lean toolchain and the Mathlib bridge build that the repository's verify workflow prepares for it.
# Every step records its exit status, wall time, peak RSS (GNU time) and disk use.
#
# Decision rules, fixed before the run. A suite step fails exactly when its rule fails, so each step's conclusion is
# its verdict; logs are diagnostics only.
#   1-self-test: exit 0; every control of result.json passed.
#   2-purity: exit 0; outcome PASS.
#   3-synthetic: exit 0; every non-informational entry of the printed JSON is true.
#   4-conformance: exit 0; every status PASS, except NOT RUN for exactly TR5 and G-A1.
#   5-a1-conformance: exit 0; every status PASS.
#   6a-a1-controls-no-main: exit 2 (usage) and no result file written.
#   6-a1-controls: no status other than PASS and NOT RUN; NOT RUN for exactly RT-T; the failed list equals the NOT
#     RUN list; exit 1 when that list is nonempty, else 0.
#   8-y8: exit 0; Y8 PASS; no control failed.
#   9-mutation: exit 0; base statuses PASS except NOT RUN for exactly conformance/TR5 and conformance/G-A1; NOT
#     APPLIED for exactly v60e:U01; every survivor is one of the seven survivors of the local run at T (c2:D02,
#     v60e:V05, v60e:I06, v60e:C08, v60e:H03, v60e:P01, cache:K08), so no mutant killed there survives here.
#   lean-install: exit 0.
#   lean-build: exit 0 and the worktree's status unchanged (empty).
#   7-release-gate: exit 0.
# Deferred to post-landing validation: TR5, G-A1, EI14.
#
# ci-results.json, schema ledger-coverage-suite-ci/1: {schema; commits {ci_commit, tool_commit, main,
# origin_main_at_run}; workflow {path, git_blob, sha256}; config {path, sha256_expected, sha256}; run {id, attempt,
# repository, ref, event, sha}; environment {os, kernel, image_os, image_version, runner_name, runner_arch, python,
# python_executable, git, cpus, mem_total_kB, disk_root_bytes}; steps [{id, exit, wall_seconds, max_rss_kB,
# disk_used_bytes, disk_avail_bytes, verdict (PASS, FAIL or NOT RUN), reasons}]; controls {step: {control id:
# status}}; y8 {synthetic_engine, actual}; mutation {counts, base_counts, killed, survived, not_applied,
# killed_here_survived_locally, source_files, tree_entries, mutant_trees_bytes}; deferred_post_landing;
# not_runnable_pre_landing [{id, reason}]; all_verdicts_pass; evidence_sha256 {file: sha256}}.
on:
  push:
    branches: [ci/ledger-coverage-suite-4f4a9d58]
permissions:
  contents: read
concurrency:
  group: ledger-coverage-suite-ci
  cancel-in-progress: false
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      T: 4f4a9d58fd0bf41289a4904c9b39c00c711c9093
      MAIN: 9deb69568d8231210c7f39cb65be943dea566371
      BRANCH: ci/ledger-coverage-suite-4f4a9d58
      WFP: .github/workflows/ledger-coverage-suite-ci.yml
      CFG: "HEAD:verification/audits/foundations/a1exit-deletion-20261121/retirement-config.json"
      CFGSHA: 5072a3b0e25e9283acecf4c3df87f820e34464d8d6e2e501ec672615114a96a0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: ci
          fetch-depth: 0
          persist-credentials: false

      - name: helpers
        id: helpers
        run: |
          set -euo pipefail
          LCS="$RUNNER_TEMP/lcs"
          mkdir -p "$LCS/ev" "$LCS/out" "$LCS/bin" "$LCS/harness"
          echo "LCS=$LCS" >> "$GITHUB_ENV"
          echo "TOOL=$GITHUB_WORKSPACE/tool" >> "$GITHUB_ENV"
          cat > "$LCS/bin/run_step.sh" <<'LCS_HELPER_EOF'
          #!/bin/bash
          # run_step.sh ID CMD...: runs CMD in the tool worktree under GNU time and records, beside the evidence, its exit
          # status (ID.exit), start and end times (ID.wall), the GNU time report with peak RSS (ID.time) and disk use after it
          # (ID.df: used and available bytes of /). Always exits 0; the step's verdict is decided by verdict.py.
          set -u
          id="$1"
          shift
          ev="$LCS/ev"
          cd "$TOOL" || exit 70
          t0=$(date +%s.%N)
          /usr/bin/time -v -o "$ev/$id.time" "$@" > "$ev/$id.stdout" 2> "$ev/$id.stderr"
          rc=$?
          t1=$(date +%s.%N)
          printf '%s\n' "$rc" > "$ev/$id.exit"
          printf '%s %s\n' "$t0" "$t1" > "$ev/$id.wall"
          df -B1 --output=used,avail / | tail -n 1 > "$ev/$id.df"
          exit 0
          LCS_HELPER_EOF
          cat > "$LCS/bin/verdict.py" <<'LCS_HELPER_EOF'
          """verdict.py STEP: applies STEP's decision rule (stated in the workflow header) to its exit status and its result
          files, writes STEP.verdict.json in the evidence directory and exits 1 when the rule fails, so that the step's
          conclusion carries the verdict."""
          import json
          import os
          import sys

          LCS = os.environ['LCS']
          EV = os.path.join(LCS, 'ev')
          OUT = os.path.join(LCS, 'out')
          MUT = os.path.join(LCS, 'mutwork')
          # the survivors of the local mutation run at the tool commit
          LOCAL_SURVIVORS = {'c2:D02', 'v60e:V05', 'v60e:I06', 'v60e:C08', 'v60e:H03', 'v60e:P01', 'cache:K08'}


          def load(path):
              with open(path) as f:
                  return json.load(f)


          def rows(controls):
              """{id: status} from a list of {id, status} rows or a {id: {status}} map; a repeated id is an error."""
              out = {}
              items = controls.items() if isinstance(controls, dict) else [(c['id'], c) for c in controls]
              for cid, c in items:
                  if cid in out:
                      raise ValueError('control id %s repeated' % cid)
                  out[cid] = c['status']
              return out


          def main():
              step = sys.argv[1]
              reasons = []
              extra = {}
              controls = None

              def need(cond, why):
                  if not cond:
                      reasons.append(why)

              try:
                  with open(os.path.join(EV, step + '.exit')) as f:
                      rc = int(f.read().strip())
              except Exception as exc:
                  rc = None
                  reasons.append('no exit status: %r' % exc)
              try:
                  if step == '1-self-test':
                      need(rc == 0, 'exit %s' % rc)
                      controls = {}
                      for c in load(os.path.join(OUT, 'st', 'result.json'))['controls']:
                          if c['id'] in controls:
                              raise ValueError('control id %s repeated' % c['id'])
                          controls[c['id']] = 'PASS' if c['passed'] is True else 'FAIL'
                      need(controls and all(v == 'PASS' for v in controls.values()), 'a self-test control did not pass')
                  elif step == '2-purity':
                      need(rc == 0, 'exit %s' % rc)
                      d = load(os.path.join(OUT, 'p', 'result.json'))
                      controls = {'outcome': d['outcome']}
                      need(d['outcome'] == 'PASS', 'outcome %s' % d['outcome'])
                  elif step == '3-synthetic':
                      need(rc == 0, 'exit %s' % rc)
                      d = load(os.path.join(EV, '3-synthetic.stdout'))
                      controls = {k: ('PASS' if v is True else 'FAIL') for k, v in d.items() if not k.startswith('_')}
                      extra['informational'] = {k: v for k, v in d.items() if k.startswith('_')}
                      need(controls and all(v == 'PASS' for v in controls.values()), 'a synthetic control is not true')
                  elif step == '4-conformance':
                      need(rc == 0, 'exit %s' % rc)
                      controls = rows(load(os.path.join(OUT, 'conf', 'conformance-controls.json'))['controls'])
                      nr = sorted(k for k, v in controls.items() if v == 'NOT RUN')
                      need(nr == ['G-A1', 'TR5'], 'NOT RUN set %s' % nr)
                      bad = sorted(k for k, v in controls.items() if v not in ('PASS', 'NOT RUN'))
                      need(not bad, 'not PASS: %s' % bad)
                  elif step == '5-a1-conformance':
                      need(rc == 0, 'exit %s' % rc)
                      controls = rows(load(os.path.join(OUT, 'a1c', 'a1-conformance.json'))['controls'])
                      bad = sorted(k for k, v in controls.items() if v != 'PASS')
                      need(controls and not bad, 'not PASS: %s' % bad)
                  elif step == '6a-a1-controls-no-main':
                      need(rc == 2, 'exit %s, expected 2 (usage)' % rc)
                      need(not os.path.exists(os.path.join(OUT, 'a1-nomain', 'a1-controls.json')), 'a result file was written')
                  elif step == '6-a1-controls':
                      d = load(os.path.join(OUT, 'a1', 'a1-controls.json'))
                      controls = rows(d['controls'])
                      nr = sorted(k for k, v in controls.items() if v == 'NOT RUN')
                      need(nr == ['RT-T'], 'NOT RUN set %s' % nr)
                      bad = sorted(k for k, v in controls.items() if v not in ('PASS', 'NOT RUN'))
                      need(not bad, 'not PASS: %s' % bad)
                      need(sorted(d['failed']) == nr, 'failed list %s differs from the NOT RUN set' % d['failed'])
                      need(rc == (1 if d['failed'] else 0), 'exit %s inconsistent with the failed list' % rc)
                      extra['timing_seconds'] = d.get('timing_seconds')
                  elif step == '8-y8':
                      need(rc == 0, 'exit %s' % rc)
                      d = load(os.path.join(OUT, 'y8', 'a1-controls.json'))
                      controls = rows(d['controls'])
                      need(controls.get('Y8') == 'PASS', 'Y8 %s' % controls.get('Y8'))
                      need(d['failed'] == [], 'failed %s' % d['failed'])
                      extra['y8_actual'] = d['controls'].get('Y8', {}).get('actual')
                  elif step == '9-mutation':
                      need(rc == 0, 'exit %s' % rc)
                      d = load(os.path.join(MUT, 'results.json'))
                      base = load(os.path.join(MUT, 'base.json'))
                      nr = sorted(k for k, v in base.items() if v == 'NOT RUN')
                      need(nr == ['conformance/G-A1', 'conformance/TR5'], 'base NOT RUN set %s' % nr)
                      bad = sorted(k for k, v in base.items() if v not in ('PASS', 'NOT RUN'))
                      need(not bad, 'base not PASS: %s' % bad)
                      controls = {}
                      for m in d['mutants']:
                          if m['id'] in controls:
                              raise ValueError('mutant id %s repeated' % m['id'])
                          controls[m['id']] = m['status']
                      na = sorted(k for k, v in controls.items() if v == 'NOT APPLIED')
                      need(na == ['v60e:U01'], 'NOT APPLIED set %s' % na)
                      surv = sorted(k for k, v in controls.items() if v == 'SURVIVED')
                      need(set(surv) <= LOCAL_SURVIVORS, 'survivors killed in the local run: %s' % sorted(set(surv) - LOCAL_SURVIVORS))
                      other = sorted(k for k, v in controls.items() if v not in ('KILLED', 'SURVIVED', 'NOT APPLIED'))
                      need(not other, 'unknown status: %s' % other)
                      extra.update(counts=d['counts'], base_counts=d['base_counts'], survived=surv, not_applied=na,
                                   killed=sum(1 for v in controls.values() if v == 'KILLED'),
                                   killed_here_survived_locally=sorted(k for k in LOCAL_SURVIVORS if controls.get(k) == 'KILLED'))
                  elif step in ('lean-install', '7-release-gate'):
                      need(rc == 0, 'exit %s' % rc)
                  elif step == 'lean-build':
                      need(rc == 0, 'exit %s' % rc)
                      with open(os.path.join(EV, 'lean-build.tree-status')) as f:
                          s = f.read()
                      need(s == '', 'the worktree changed: %s' % s[:400])
                  else:
                      reasons.append('no rule for step %s' % step)
              except Exception as exc:
                  reasons.append('unreadable result: %s: %s' % (type(exc).__name__, exc))
              v = {'step': step, 'exit': rc, 'pass': not reasons, 'reasons': reasons, 'controls': controls, 'extra': extra}
              with open(os.path.join(EV, step + '.verdict.json'), 'w') as f:
                  json.dump(v, f, indent=1, sort_keys=True, default=str)
              print('%s %s %s' % (step, 'PASS' if not reasons else 'FAIL', '; '.join(reasons)))
              return 0 if not reasons else 1


          if __name__ == '__main__':
              sys.exit(main())
          LCS_HELPER_EOF
          cat > "$LCS/bin/collect.py" <<'LCS_HELPER_EOF'
          """collect.py MODE: `identity` writes identity.json (the commits and the workflow blob), `env` writes env.json (the
          runner environment), `results` copies the runners' result files into the evidence directory and writes
          ci-results.json (schema ledger-coverage-suite-ci/1, stated in the workflow header)."""
          import hashlib
          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys

          LCS = os.environ['LCS']
          EV = os.path.join(LCS, 'ev')
          OUT = os.path.join(LCS, 'out')
          STEPS = ['1-self-test', '2-purity', '3-synthetic', '4-conformance', '5-a1-conformance', '6a-a1-controls-no-main',
                   '6-a1-controls', '8-y8', '9-mutation', 'lean-install', 'lean-build', '7-release-gate']
          COPIES = [('st/result.json', '1-self-test-result.json'), ('p/result.json', '2-purity-result.json'),
                    ('conf/conformance-controls.json', '4-conformance-controls.json'),
                    ('a1c/a1-conformance.json', '5-a1-conformance.json'), ('a1/a1-controls.json', '6-a1-controls.json'),
                    ('y8/a1-controls.json', '8-y8-a1-controls.json'), ('../mutwork/results.json', '9-mutation-results.json'),
                    ('../mutwork/base.json', '9-mutation-base.json')]
          NOT_RUNNABLE = [
              {'id': 'RT-T', 'reason': 'needs reviewed records, none of which exists before review; the A1 runner reports it '
                                       'NOT RUN, as in the local run; not bound to the host'},
              {'id': 'TR45 op-C', 'reason': 'the offline replay of an op-C result needs delegated evidence recorded by native '
                                            'runs at X and C (G-A1, deferred); no entry point or flag of the runners at the '
                                            'tool commit performs it'},
              {'id': 'RestHost real reads', 'reason': 'the tool builds RestHost only for chain admission from a plan commit F '
                                                      'with a reviewed configuration (TR5) and for native delegated runs of an '
                                                      'admitted configuration (G-A1); no F exists before landing and no runner '
                                                      'flag performs a host read; the job token is not given to the suite '
                                                      'steps, so the runs match the local ones'},
              {'id': 'sec. 16.7 double run', 'reason': 'no entry point or flag runs a tool result twice and compares the '
                                                       'bytes; it would need new control code'},
          ]


          def git(*a):
              r = subprocess.run(['git'] + list(a), capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else None


          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''):
                      h.update(b)
              return h.hexdigest()


          def read(p):
              try:
                  with open(p) as f:
                      return f.read()
              except OSError:
                  return None


          def dump(name, obj):
              with open(os.path.join(EV, name), 'w') as f:
                  json.dump(obj, f, indent=1, sort_keys=True, default=str)
                  f.write('\n')


          def identity():
              ws = os.environ['GITHUB_WORKSPACE']
              ci_dir, wfp = os.path.join(ws, 'ci'), os.environ['WFP']
              dump('identity.json', {
                  'ci_commit': git('-C', ci_dir, 'rev-parse', 'HEAD'),
                  'ci_commit_parents': (git('-C', ci_dir, 'rev-list', '--parents', '-n', '1', 'HEAD') or '').split()[1:],
                  'tool_commit': os.environ['T'],
                  'tool_worktree_head': git('-C', os.environ['TOOL'], 'rev-parse', 'HEAD'),
                  'main': os.environ['MAIN'],
                  'origin_main_at_run': git('-C', ci_dir, 'rev-parse', '--verify', '-q', 'refs/remotes/origin/main'),
                  'workflow': {'path': wfp, 'git_blob': git('-C', ci_dir, 'rev-parse', 'HEAD:' + wfp),
                               'sha256': sha256_file(os.path.join(ci_dir, wfp))},
              })


          def env():
              mem = None
              for line in (read('/proc/meminfo') or '').splitlines():
                  if line.startswith('MemTotal:'):
                      mem = int(line.split()[1])
              osr = {}
              for line in (read('/etc/os-release') or '').splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      osr[k] = v.strip('"')
              du = shutil.disk_usage('/')
              dump('env.json', {'os': osr.get('PRETTY_NAME'), 'kernel': platform.release(),
                                'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'),
                                'runner_name': os.environ.get('RUNNER_NAME'), 'runner_arch': os.environ.get('RUNNER_ARCH'),
                                'python': sys.version, 'python_executable': sys.executable, 'git': git('--version'),
                                'cpus': os.cpu_count(), 'mem_total_kB': mem,
                                'disk_root_bytes': {'total': du.total, 'used': du.used, 'free': du.free}})


          def time_report(step):
              out = {}
              for line in (read(os.path.join(EV, step + '.time')) or '').splitlines():
                  if ':' in line:
                      k, v = line.rsplit(':', 1)
                      out[k.strip()] = v.strip()
              try:
                  return int(out['Maximum resident set size (kbytes)'])
              except (KeyError, ValueError):
                  return None


          def results():
              for src, dst in COPIES:
                  p = os.path.normpath(os.path.join(OUT, src))
                  if os.path.exists(p):
                      shutil.copy(p, os.path.join(EV, dst))
              ident = json.loads(read(os.path.join(EV, 'identity.json')) or '{}')
              steps, controls, mutation = [], {}, None
              for s in STEPS:
                  v = json.loads(read(os.path.join(EV, s + '.verdict.json')) or 'null')
                  ex = read(os.path.join(EV, s + '.exit'))
                  wall = (read(os.path.join(EV, s + '.wall')) or '').split()
                  df = (read(os.path.join(EV, s + '.df')) or '').split()
                  steps.append({'id': s, 'exit': int(ex) if ex and ex.strip().lstrip('-').isdigit() else None,
                                'wall_seconds': round(float(wall[1]) - float(wall[0]), 1) if len(wall) == 2 else None,
                                'max_rss_kB': time_report(s),
                                'disk_used_bytes': int(df[0]) if len(df) == 2 else None,
                                'disk_avail_bytes': int(df[1]) if len(df) == 2 else None,
                                'verdict': ('PASS' if v['pass'] else 'FAIL') if v else 'NOT RUN',
                                'reasons': v['reasons'] if v else []})
                  if v and v.get('controls') is not None:
                      controls[s] = v['controls']
                  if s == '9-mutation' and v:
                      mutation = dict(v.get('extra') or {}, source_files=(read(os.path.join(EV, '9-mutation.source-files'))
                                                                          or '').strip(),
                                      tree_entries=(read(os.path.join(EV, '9-mutation.tree-entries')) or '').strip(),
                                      mutant_trees_bytes=(read(os.path.join(EV, '9-mutation.trees-bytes')) or '').strip())
              y8 = json.loads(read(os.path.join(EV, '8-y8.verdict.json')) or 'null')
              syn = json.loads(read(os.path.join(EV, '3-synthetic.verdict.json')) or 'null')
              doc = {
                  'schema': 'ledger-coverage-suite-ci/1',
                  'commits': {'ci_commit': ident.get('ci_commit'), 'tool_commit': ident.get('tool_commit'),
                              'main': ident.get('main'), 'origin_main_at_run': ident.get('origin_main_at_run')},
                  'workflow': ident.get('workflow'),
                  'config': {'path': os.environ.get('CFG'), 'sha256_expected': os.environ.get('CFGSHA'),
                             'sha256': (read(os.path.join(EV, 'staged-config.sha256')) or '').strip() or None},
                  'run': {'id': os.environ.get('GITHUB_RUN_ID'), 'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                          'repository': os.environ.get('GITHUB_REPOSITORY'), 'ref': os.environ.get('GITHUB_REF'),
                          'event': os.environ.get('GITHUB_EVENT_NAME'), 'sha': os.environ.get('GITHUB_SHA')},
                  'environment': json.loads(read(os.path.join(EV, 'env.json')) or 'null'),
                  'steps': steps,
                  'controls': controls,
                  'y8': {'synthetic_engine': ((syn or {}).get('extra') or {}).get('informational', {}).get('_Y8_engine'),
                         'actual': ((y8 or {}).get('extra') or {}).get('y8_actual')},
                  'mutation': mutation,
                  'deferred_post_landing': ['TR5', 'G-A1', 'EI14'],
                  'not_runnable_pre_landing': NOT_RUNNABLE,
                  'all_verdicts_pass': all(s['verdict'] == 'PASS' for s in steps),
              }
              doc['evidence_sha256'] = {n: sha256_file(os.path.join(EV, n)) for n in sorted(os.listdir(EV))
                                        if n != 'ci-results.json' and os.path.isfile(os.path.join(EV, n))}
              dump('ci-results.json', doc)
              print(json.dumps({'all_verdicts_pass': doc['all_verdicts_pass'],
                                'steps': {s['id']: s['verdict'] for s in steps}}, indent=1))


          if __name__ == '__main__':
              {'identity': identity, 'env': env, 'results': results}[sys.argv[1]]()
          LCS_HELPER_EOF
          chmod +x "$LCS/bin/run_step.sh"

      - name: identity of the commits and the tool worktree
        id: identity
        run: |
          set -euo pipefail
          fail() { echo "IDENTITY FAIL: $*" >&2; exit 1; }
          [ "$GITHUB_EVENT_NAME" = push ] || fail "event $GITHUB_EVENT_NAME"
          [ "$GITHUB_REF" = "refs/heads/$BRANCH" ] || fail "ref $GITHUB_REF"
          cd "$GITHUB_WORKSPACE/ci"
          [ "$(git rev-parse --is-shallow-repository)" = false ] || fail "shallow clone"
          ci=$(git rev-parse HEAD)
          [ "$ci" = "$GITHUB_SHA" ] || fail "HEAD is not the pushed commit"
          [ "$(git rev-list --parents -n 1 HEAD)" = "$ci $T" ] || fail "the CI commit is not a single-parent child of T"
          [ "$(git diff --no-renames --name-status "$T" HEAD)" = "$(printf 'A\t%s' "$WFP")" ] || fail "the CI commit changes more than its workflow"
          [ -z "$(git status --porcelain)" ] || fail "the CI checkout is not clean"
          for c in "$T" "$MAIN" e837e3dbaa605efc867a213f3345cee14c36d8f5 53c6601a10419b6b333cc992474272501ab542af \
                   14ac71b4b0a0c0aa2d7068d6799a73f474097060 4c79be642ca631573f06b444903be75ec4f5e2b6 \
                   413b0bb88f39cad901befcf4684355c7ee39480b 8e9b83341cf5bc7fd9fb260892d0385fc9bfab4d; do
            git cat-file -e "$c^{commit}" || fail "commit $c is not in the clone"
          done
          git worktree add --detach "$TOOL" "$T"
          [ "$(git -C "$TOOL" rev-parse HEAD)" = "$T" ] || fail "the tool worktree's HEAD is not T"
          [ -z "$(git -C "$TOOL" status --porcelain)" ] || fail "the tool worktree is not clean"
          [ ! -e "$TOOL/$WFP" ] || fail "the tool worktree holds this workflow"
          python3 -I "$LCS/bin/collect.py" identity

