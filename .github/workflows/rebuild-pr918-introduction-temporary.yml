name: Temporary Introduction canonical preview after #997
on:
  push:
    branches:
      - draft/oi-introductory-paper-20261025
    paths:
      - .github/workflows/rebuild-pr918-introduction-temporary.yml
permissions:
  contents: write
jobs:
  publish-preview:
    name: Introduction canonical rebuild and QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install publication toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          pandoc --version | head -1
      - name: Canonically build only Introduction
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.sh Introduction 2>&1 | tee /tmp/pr918-intro-build.log
          ! grep -E '(Missing character|build: FAILED|PDF FAILED|TEX FAILED)' /tmp/pr918-intro-build.log
          python3 tools/staleness_check.py | tee /tmp/pr918-intro-staleness.log
          grep -q 'staleness_check: OK (14 matched, 0 unstamped)' /tmp/pr918-intro-staleness.log
          python3 papers/oi_lattice_code/mirror_check.py
      - name: Check theorem and scope survival and PDF density
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          import re
          current=Path('papers/Introduction.md').read_text()
          historical=check_output(['git','show','fde5cbbe2ec21a1b66ccce3465dafbd5e0194f59:papers/Introduction.md'],text=True)
          markers=['**Theorem 1**','**Theorem 2**','**Theorem 3**','**Theorem 4**','**Corollary** (recurrence-cycle indivisibility)','**Corollary** (proved on paper']
          for marker in markers:
            a=[s for s in current.splitlines() if s.startswith(marker)]
            b=[s for s in historical.splitlines() if s.startswith(marker)]
            assert len(a)==len(b)==1 and a[0]==b[0],marker
          assert current.count('complex matrix')>=3
          assert 'no card arrangement violates' not in current
          assert 'single-outcome' in current and 'branch by branch' in current
          assert current.count('$$') == historical.count('$$'), 'Display math changed'
          print('THEOREM_AND_SCOPE_PINS_OK',len(markers),flush=True)
          PY
          pdfinfo papers/Introduction.pdf | grep -E '^Pages:|^Page size:|^File size:'
          pdftotext -layout papers/Introduction.pdf - | python3 -c 'import sys,statistics; pages=[p.strip() for p in sys.stdin.read().split(chr(12)) if p.strip()]; lengths=[len(p) for p in pages]; print("QA_DENSITY",len(lengths),statistics.median(lengths),min(lengths)); assert 18 <= len(lengths) <= 32 and statistics.median(lengths) > 1000'
      - name: Render bounded pages for independent inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,base64,re
          text=subprocess.check_output(['pdftotext','-layout','papers/Introduction.pdf','-'],text=True)
          pages=text.split(chr(12))
          for label,phrase in [('bells','the card protocol'),('operations','complex matrix kinematics'),('conclusion','open problems')]:
            ix=next((i+1 for i,p in enumerate(pages) if phrase in re.sub(r'\\s+',' ',p).lower()),None)
            if ix is None:
              print('QA_PAGE_NOT_FOUND',label,phrase,flush=True)
              continue
            prefix='/tmp/pr918-'+label
            subprocess.run(['pdftoppm','-f',str(ix),'-l',str(ix),'-scale-to','1200','-jpeg','-jpegopt','quality=56','-singlefile','papers/Introduction.pdf',prefix],check=True)
            raw=pathlib.Path(prefix+'.jpg').read_bytes()
            print('QA_IMAGE_BEGIN',label,ix,len(raw),flush=True)
            print(base64.b64encode(raw).decode('ascii'),flush=True)
            print('QA_IMAGE_END',label,flush=True)
          PY
      - name: Commit only regenerated Introduction artifacts and remove temporary workflow
        shell: bash
        env:
          BRANCH: draft/oi-introductory-paper-20261025
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || { echo 'ABORT: branch advanced'; exit 1; }
          git rm .github/workflows/rebuild-pr918-introduction-temporary.yml
          git add papers/Introduction.tex papers/Introduction.pdf
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Introduction after bounded post-997 scope reconciliation"
          git push origin "HEAD:refs/heads/$BRANCH"
