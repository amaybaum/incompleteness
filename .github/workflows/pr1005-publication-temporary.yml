name: Temporary PR 1005 minimal-source publication reconciliation

on:
  push:
    branches:
      - audit/post982-minimum-manuscript-diff-20261030
    paths:
      - .github/workflows/pr1005-publication-temporary.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Canonical publication toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          pandoc --version | head -1
          xelatex --version | head -1
      - name: Synchronize only three deleted FULL-book source subspans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          full=Path('book/The-Incompleteness-of-Observation-FULL.md')
          data=full.read_text()
          clauses=[
          " A uniformly drawn permutation of that set would have $\\ln N \\approx 5 \\times 10^{243}$, a value that holds only under that model.",
          "Erdős, P., & Turán, P. (1965). On some problems of a statistical group-theory. I. *Zeitschrift für Wahrscheinlichkeitstheorie und verwandte Gebiete* 4: 175-186. [Typical order of a random permutation.]\\n\\n".replace('\\n','\n'),
          "Erdős, P., & Turán, P. (1967). On some problems of a statistical group-theory. III. *Acta Mathematica Academiae Scientiarum Hungaricae* 18: 309-320. [Normal law for the logarithm of the order.]\\n\\n".replace('\\n','\n'),
          ]
          for clause in clauses:
              observed=data.count(clause)
              assert observed==1, ('FULL mirror expected unique span',clause[:90],observed)
              data=data.replace(clause,'',1)
          assert 'Landau, E. (1903)' in data
          full.write_text(data)
          assert 'A uniformly drawn permutation of that set' not in Path('book/ch18-beyond.md').read_text()
          assert 'Erdős, P., & Turán, P.' not in Path('book/bibliography.md').read_text()
          assert 'Landau, E. (1903)' in Path('book/bibliography.md').read_text()
          print('MIRROR_SUBSPAN_EXACT_3',flush=True)
          PY
          python3 papers/oi_lattice_code/mirror_check.py
      - name: Rebuild only Complexity and consolidated book
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.sh Complexity | tee /tmp/pr1005-complexity-build.log
          sh ./build.sh --book | tee /tmp/pr1005-book-build.log
          ! grep -E 'Missing character|build: FAILED|PDF FAILED|TEX FAILED' /tmp/pr1005-*-build.log
          python3 tools/staleness_check.py
          python3 tools/voice_check.py
          python3 tools/claims_check.py
          python3 papers/oi_lattice_code/mirror_check.py
      - name: Replay SC-42 successor and reconcile mutable structured result
        shell: bash
        run: |
          set -euo pipefail
          record=verification/audits/manuscript/bell-operational-reconciliation-20261029
          python3 -I -B "$record/check_sc42_integration.py" > /tmp/pr1005-sc42-normal.json
          python3 -I -O -B "$record/check_sc42_integration.py" > /tmp/pr1005-sc42-opt.json
          cmp /tmp/pr1005-sc42-normal.json /tmp/pr1005-sc42-opt.json
          python3 -I -B "$record/check_sc42_integration.py" --self-test > /tmp/pr1005-sc42-controls.json
          cmp /tmp/pr1005-sc42-controls.json "$record/sc42-integration-controls.json"
          cp /tmp/pr1005-sc42-normal.json "$record/sc42-integration-result.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('verification/audits/manuscript/bell-operational-reconciliation-20261029/sc42-integration-result.json')
          data=json.loads(r.read_text())
          assert data['verdict']=='PASS'
          checks=data['checks']
          assert not any('Erdős, P., & Turán' in z['predicate'] for z in checks)
          print('SC42_RETAINED_FORWARD',len(checks),'all PASS',flush=True)
          PY
      - name: Verify publication change scope and rendered text density
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'book/The-Incompleteness-of-Observation-FULL.md',
             'book/The-Incompleteness-of-Observation-FULL.tex',
             'book/The-Incompleteness-of-Observation-FULL.pdf',
             'papers/Complexity.tex','papers/Complexity.pdf',
             'verification/audits/manuscript/bell-operational-reconciliation-20261029/sc42-integration-result.json'}
          assert actual==expected,(sorted(actual),sorted(expected))
          print('EXPECTED_PUBLICATION_SCOPE_6',flush=True)
          PY
          for pdf in papers/Complexity.pdf book/The-Incompleteness-of-Observation-FULL.pdf; do
            pdfinfo "$pdf" | grep -E 'Pages:|Page size:'
            pdftotext -layout "$pdf" - | python3 -c 'import sys,statistics; cs=[len(s.strip()) for s in sys.stdin.read().split(chr(12)) if s.strip()]; print("PAGE_DENSITY",len(cs),statistics.median(cs)); assert statistics.median(cs)>1000'
          done
      - name: Commit artifacts and remove temporary workflow atomically
        shell: bash
        env:
          BRANCH: audit/post982-minimum-manuscript-diff-20261030
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || { echo 'ABORT: PR head advanced'; exit 1; }
          git rm .github/workflows/pr1005-publication-temporary.yml
          git add book/The-Incompleteness-of-Observation-FULL.md
          git add book/The-Incompleteness-of-Observation-FULL.tex book/The-Incompleteness-of-Observation-FULL.pdf
          git add papers/Complexity.tex papers/Complexity.pdf
          git add verification/audits/manuscript/bell-operational-reconciliation-20261029/sc42-integration-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(#1005): mirror source fixes, rebuild canonical publications, replay SC42"
          git push origin "HEAD:refs/heads/$BRANCH"
