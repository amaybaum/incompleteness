name: verify

# Machine-checked verification layer (verification/lean).
#
# The three proof files are self-contained Lean 4 — no Mathlib, no lake project,
# zero imports — so the kernel gate is just a `lean` binary and three commands.
# A clean exit is the certificate; see verification/lean/VERIFYING.md.

on:
  push:
    paths:
      - 'verification/**'
      # the foundations probes are gated below, so their own edits must trigger this workflow;
      # without these lines the job exists but never runs when a probe itself changes
      - 'papers/oi_lattice_code/foundations/comb_reachability_probes.py'
      - 'papers/oi_lattice_code/foundations/phaselock_probes.py'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'verification/**'
      - 'papers/oi_lattice_code/foundations/comb_reachability_probes.py'
      - 'papers/oi_lattice_code/foundations/phaselock_probes.py'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

jobs:
  kernel:
    name: Lean kernel check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: lean --version

      # Each file is checked independently and the failures are summed, so one
      # rejection does not hide the state of the other two.
      - name: Kernel check
        working-directory: verification/lean
        run: |
          rc=0
          for f in OI_Gauge_Certificates OI_Structural_Core OI_Staggered_Relations \
                   OI_Regulator_Symmetry OI_Structural_Chain; do
            echo "::group::lean ${f}.lean"
            if lean "${f}.lean"; then
              echo "OK ${f}.lean"
            else
              echo "FAIL ${f}.lean"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # The Mathlib bridge is a separate lake project with a pinned toolchain, and a separate
  # job: it is slower and has its own failure surface, and a breakage there must not be
  # able to obscure the state of the zero-import core gate above.
  bridge:
    name: Mathlib bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: verification/lean-mathlib
        run: |
          lean --version
          lake exe cache get
          lake build

  probes:
    name: Numerical probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Probes
        working-directory: verification/lean
        run: |
          for p in gauge_certificates structural_core staggered_relations \
                   structural_chain representation_bridge; do
            echo "=== ${p}_probe.py ==="
            python3 "${p}_probe.py"
          done

      # papers/oi_lattice_code/ has sat outside this gate; these are the first of its probes
      # brought in. Named individually rather than by directory glob: several of the others
      # (intervention_probes at K=2 builds 124k states) are far too slow for CI. Both of these
      # use the standard library alone, so nothing here depends on the pip step above.
      - name: Foundations probes
        working-directory: papers/oi_lattice_code/foundations
        run: |
          rc=0
          for p in comb_reachability_probes phaselock_probes; do
            echo "=== ${p}.py ==="
            python3 "${p}.py" || rc=1
          done
          exit $rc
