name: verify

# Machine-checked verification layer (verification/lean).
#
# The six core proof files are self-contained Lean 4 — no Mathlib, no lake project,
# zero imports — so the kernel gate is just a `lean` binary and one command per file.
# A clean exit is the certificate; see verification/lean/VERIFYING.md.

# NO PATH FILTERS, deliberately. These three jobs are required status checks on main, and a
# required check that never runs never reports: GitHub leaves it Expected forever and the pull
# request cannot be merged. A path filter would do exactly that to any pull request touching only
# papers/*.md. The filters that used to live here also had to name every gated probe individually,
# which was a standing trap of its own — a probe added to the job below but not to both filter
# lists is a gate that silently never fires. Cheaper to run the suite on everything.
#
# pull_request covers every branch and re-runs on each push to the head branch (synchronize), so a
# dev pull request is checked on every commit. push is restricted to main so that the same commit
# is not checked twice under the same check-run names, which is what a required-check rule has to
# match against. The gap this leaves is a push to dev with no pull request open; it closes the
# moment one is opened, and nothing merges without one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kernel:
    name: Lean kernel check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: lean --version

      # Each file is checked independently and the failures are summed, so one
      # rejection does not hide the state of the other two.
      - name: Kernel check
        working-directory: verification/lean
        run: |
          rc=0
          for f in OI_Gauge_Certificates OI_Structural_Core OI_Staggered_Relations \
                   OI_Regulator_Symmetry OI_Structural_Chain OI_Time_Reversal; do
            echo "::group::lean ${f}.lean"
            if lean "${f}.lean"; then
              echo "OK ${f}.lean"
            else
              echo "FAIL ${f}.lean"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # The Mathlib bridge is a separate lake project with a pinned toolchain, and a separate
  # job: it is slower and has its own failure surface, and a breakage there must not be
  # able to obscure the state of the zero-import core gate above.
  bridge:
    name: Mathlib bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: verification/lean-mathlib
        run: |
          lean --version
          lake exe cache get
          lake build

  probes:
    name: Numerical probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Probes
        working-directory: verification/lean
        run: |
          for p in gauge_certificates structural_core staggered_relations \
                   structural_chain representation_bridge time_reversal \
                   equivalence_chain hidden_memory finite_horizon_equivalence \
                   c3_necessity canonical_measure finiteness cubic_isotropy \
                   idempotent_trace link_decomposition; do
            echo "=== ${p}_probe.py ==="
            python3 "${p}_probe.py"
          done

      # papers/oi_lattice_code/ has sat outside this gate; these are the first of its probes
      # brought in. Named individually rather than by directory glob: several of the others
      # (intervention_probes at K=2 builds 124k states) are far too slow for CI. All twelve of these
      # use the standard library alone, so nothing here depends on the pip step above.
      - name: Foundations probes
        working-directory: papers/oi_lattice_code/foundations
        run: |
          rc=0
          for p in comb_reachability_probes phaselock_probes source_lift_probes \
                   induced_source_probes gauge_support_probes \
                   bargmann_bridge_probes coherence_boundary_probes \
                   native_group_probes finite_horizon_probes \
                   recurrence_entropy_probes comb_dimension_probes \
                   comb_realization_probes; do
            echo "=== ${p}.py ==="
            python3 "${p}.py" || rc=1
          done
          exit $rc
