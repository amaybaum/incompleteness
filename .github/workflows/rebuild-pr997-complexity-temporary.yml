name: Temporary #997 Complexity canonical formatting rebuild

on:
  push:
    branches:
      - editorial/issue-996-dimension-scope-20261029
    paths:
      - .github/workflows/rebuild-pr997-complexity-temporary.yml

permissions:
  contents: write

jobs:
  rebuild:
    name: Canonical Complexity build and PDF QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install canonical publication dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          pandoc --version | head -1
          xelatex --version | head -1
      - name: Regenerate only Complexity.tex and Complexity.pdf
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.sh Complexity 2>&1 | tee /tmp/pr997-complexity-build.log
          ! grep -E '(Missing character|build: FAILED|PDF FAILED|TEX FAILED)' /tmp/pr997-complexity-build.log
          python3 tools/staleness_check.py | tee /tmp/pr997-staleness.log
          grep -q 'staleness_check: OK (13 matched, 0 unstamped)' /tmp/pr997-staleness.log
          python3 papers/oi_lattice_code/mirror_check.py
          git diff --name-only | tee /tmp/pr997-rebuild-diff.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/pr997-rebuild-diff.txt').read_text().splitlines())
          assert changed == {'papers/Complexity.tex', 'papers/Complexity.pdf'}, changed
          md=Path('papers/Complexity.md').read_text()
          assert sum(line.strip() == '***' for line in md.splitlines()) == 11
          assert all(line.strip() != '---' for line in md.splitlines())
          assert md.count('$$') >= 44, 'display math delimiters dropped'
          print("SOURCE_AND_ARTIFACT_SCOPE_OK",len(changed),flush=True)
          PY
      - name: Verify page count, density, and restore-only display layout
        shell: bash
        run: |
          set -euo pipefail
          pdf= papers=""
          pdfinfo papers/Complexity.pdf | grep -E '^Pages:|^Page size:|^File size:'
          pdftotext -layout papers/Complexity.pdf - | python3 -c 'import sys,statistics; pages=[x.strip() for x in sys.stdin.read().split(chr(12)) if x.strip()]; cs=[len(x) for x in pages]; print("QA_PAGE_TEXT_DENSITY",len(cs),statistics.median(cs),min(cs)); assert 30<=len(cs)<=45 and statistics.median(cs)>1000'
          python3 - <<'PY'
          import base64,subprocess,pathlib
          for page in [6,18]:
              stem=f'/tmp/pr997-complexity-page-{page}'
              subprocess.run(['pdftoppm','-f',str(page),'-l',str(page),'-scale-to','1250','-jpeg','-jpegopt','quality=58','-singlefile','papers/Complexity.pdf',stem],check=True)
              b=pathlib.Path(stem+'.jpg').read_bytes()
              print('QA_IMAGE_BEGIN',page,'bytes',len(b),flush=True)
              print(base64.b64encode(b).decode('ascii'),flush=True)
              print('QA_IMAGE_END',page,flush=True)
          PY
      - name: Commit only canonical Complexity artifacts and remove temporary workflow
        shell: bash
        env:
          BRANCH: editorial/issue-996-dimension-scope-20261029
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || { echo 'ABORT: branch advanced'; exit 1; }
          git rm .github/workflows/rebuild-pr997-complexity-temporary.yml
          git add papers/Complexity.tex papers/Complexity.pdf
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Complexity publication after safe horizontal-rule normalization"
          git push origin "HEAD:refs/heads/$BRANCH"
