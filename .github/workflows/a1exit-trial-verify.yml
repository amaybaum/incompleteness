name: A1-EXIT trial verify

# Exact-tree verification of a predicted A1-retirement tree (#1477, PREREG §26.3; owner decision #1169
# c.7061660930, option (a)). workflow_dispatch only: there is no push or pull_request trigger, so no push
# launches it, and dispatching it needs owner approval (AGENTS.md §A.43 item 4). It checks out exactly the
# trial commit, builds the eight PDFs of the ledgered sources with build.sh on pandoc 3.1.3 and xelatex, and
# runs the plan commit's pinned checkers against the trial tree: preserve_check.py --tree --plan --mutants
# --pdf-compare, and guards_check.py --mutants. Every step records its exit status; result.json (§A.44), the
# logs and the built PDFs are uploaded as artifacts, and the last step fails unless every required step
# succeeded (a skipped step fails it). No step continues on error and nothing is retried.
on:
  workflow_dispatch:
    inputs:
      trial_sha:
        description: "the trial commit to verify, in full (40 lowercase hex)"
        required: true
        type: string
      plan_sha:
        description: "the plan commit P whose pinned checkers run, in full (40 lowercase hex)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a1exit-trial-verify
  cancel-in-progress: false

env:
  TRIAL: ${{ inputs.trial_sha }}
  PLAN: ${{ inputs.plan_sha }}
  REC: verification/audits/foundations/a1exit-deletion-20261121
  PANDOC_DEB: https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
  PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Inputs are full commit ids
        id: inputs
        run: |
          [[ "$TRIAL" =~ ^[0-9a-f]{40}$ ]] || { echo "trial_sha is not a full commit id"; exit 1; }
          [[ "$PLAN" =~ ^[0-9a-f]{40}$ ]] || { echo "plan_sha is not a full commit id"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.trial_sha }}
          fetch-depth: 0

      - name: The checkout is exactly the trial commit, and the plan commit is present
        id: head
        run: |
          set +e
          {
            test "$(git rev-parse HEAD)" = "$TRIAL" && test -z "$(git status --porcelain)" \
              && git cat-file -e "$PLAN^{commit}" && git rev-parse HEAD
          } > "$RUNNER_TEMP/out/head.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/head.log"; echo "$rc" > "$RUNNER_TEMP/out/head.rc"; exit "$rc"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Toolchain (pandoc 3.1.3, xelatex, poppler, numpy, scipy)
        id: toolchain
        run: |
          set +e
          (
            set -e
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended \
              texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
            curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "$PANDOC_DEB"
            echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
            sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
            test "$(pandoc --version | head -1)" = "pandoc 3.1.3"
            xelatex --version | head -1
            pip install numpy scipy
          ) > "$RUNNER_TEMP/out/toolchain.log" 2>&1
          rc=$?; tail -40 "$RUNNER_TEMP/out/toolchain.log"; echo "$rc" > "$RUNNER_TEMP/out/toolchain.rc"; exit "$rc"

      - name: Plan worktree (the pinned checkers of P)
        id: plan
        run: |
          set +e
          git worktree add --detach "$RUNNER_TEMP/plan" "$PLAN" > "$RUNNER_TEMP/out/plan.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 -I -B "$RUNNER_TEMP/plan/$REC/preserve_check.py" --verify-pins --plan "$PLAN" >> "$RUNNER_TEMP/out/plan.log" 2>&1
            rc=$?
          fi
          cat "$RUNNER_TEMP/out/plan.log"; echo "$rc" > "$RUNNER_TEMP/out/plan.rc"; exit "$rc"

      - name: Build the eight PDFs with build.sh on a copy of the trial commit; TeX equals the committed TeX
        id: build
        run: |
          set +e
          (
            set -e
            git worktree add --detach "$RUNNER_TEMP/build" "$TRIAL"
            cd "$RUNNER_TEMP/build"
            sh ./build.sh Computation GR Main Methodology SM Structure Substratum
            sh ./build.sh --book
            git diff --exit-code -- papers/Computation.tex papers/GR.tex papers/Main.tex papers/Methodology.tex \
              papers/SM.tex papers/Structure.tex papers/Substratum.tex book/The-Incompleteness-of-Observation-FULL.tex
            for f in papers/Computation.pdf papers/GR.pdf papers/Main.pdf papers/Methodology.pdf papers/SM.pdf \
                     papers/Structure.pdf papers/Substratum.pdf book/The-Incompleteness-of-Observation-FULL.pdf; do
              echo "pages $f $(pdfinfo "$f" | awk '/^Pages/{print $2}')"
            done
          ) > "$RUNNER_TEMP/out/build.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/build.log"; echo "$rc" > "$RUNNER_TEMP/out/build.rc"; exit "$rc"

      - name: preserve_check.py --tree --plan --mutants --pdf-compare (P's copy)
        id: preserve
        run: |
          set +e
          python3 -I -B "$RUNNER_TEMP/plan/$REC/preserve_check.py" --tree "$GITHUB_WORKSPACE" --plan "$PLAN" \
            --mutants --pdf-compare "$RUNNER_TEMP/build" > "$RUNNER_TEMP/out/preserve.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/preserve.log"; echo "$rc" > "$RUNNER_TEMP/out/preserve.rc"; exit "$rc"

      - name: guards_check.py --mutants (P's copy)
        id: guards
        run: |
          set +e
          python3 -I -B "$RUNNER_TEMP/plan/$REC/guards_check.py" --mutants > "$RUNNER_TEMP/out/guards.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/guards.log"; echo "$rc" > "$RUNNER_TEMP/out/guards.rc"; exit "$rc"

      - name: Write result.json
        if: ${{ always() }}
        env:
          OUTCOMES: >-
            {"inputs": "${{ steps.inputs.outcome }}", "head": "${{ steps.head.outcome }}",
             "toolchain": "${{ steps.toolchain.outcome }}", "plan": "${{ steps.plan.outcome }}",
             "build": "${{ steps.build.outcome }}", "preserve": "${{ steps.preserve.outcome }}",
             "guards": "${{ steps.guards.outcome }}"}
        run: |
          python3 -I -B - <<'PY'
          import json, os, re
          out = os.path.join(os.environ['RUNNER_TEMP'], 'out')
          outcomes = json.loads(os.environ['OUTCOMES'])
          steps = {}
          for name, outcome in outcomes.items():
              rc_path, log_path = os.path.join(out, name + '.rc'), os.path.join(out, name + '.log')
              rc = int(open(rc_path).read().strip()) if os.path.exists(rc_path) else None
              log = open(log_path, encoding='utf-8', errors='replace').read() if os.path.exists(log_path) else ''
              disc = [l.strip() for l in log.splitlines() if re.match(r'\s*(FAIL|BAD|PIN|LEDGER)\b', l)]
              steps[name] = {'outcome': outcome, 'exit_status': rc, 'discrepancies': disc}
          build_log = os.path.join(out, 'build.log')
          pages = {}
          if os.path.exists(build_log):
              for l in open(build_log, encoding='utf-8', errors='replace'):
                  m = re.match(r'pages (\S+) (\d+)$', l.strip())
                  if m:
                      pages[m.group(1)] = int(m.group(2))
          result = {'schema': 'a1exit-trial-verify-v1', 'trial_sha': os.environ['TRIAL'], 'plan_sha': os.environ['PLAN'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'steps': steps, 'pdf_pages': pages,
                    'verdict': 'pass' if all(s['outcome'] == 'success' for s in steps.values()) else 'fail'}
          json.dump(result, open(os.path.join(out, 'result.json'), 'w'), indent=1, sort_keys=True)
          print(json.dumps(result, indent=1, sort_keys=True))
          PY

      - name: Upload result.json, logs and the built PDFs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: a1exit-trial-verify-${{ inputs.trial_sha }}
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/build/papers/Computation.pdf
            ${{ runner.temp }}/build/papers/GR.pdf
            ${{ runner.temp }}/build/papers/Main.pdf
            ${{ runner.temp }}/build/papers/Methodology.pdf
            ${{ runner.temp }}/build/papers/SM.pdf
            ${{ runner.temp }}/build/papers/Structure.pdf
            ${{ runner.temp }}/build/papers/Substratum.pdf
            ${{ runner.temp }}/build/book/The-Incompleteness-of-Observation-FULL.pdf
          if-no-files-found: error

      - name: Every required step succeeded (a skipped step fails)
        if: ${{ always() }}
        run: |
          for o in "${{ steps.inputs.outcome }}" "${{ steps.head.outcome }}" "${{ steps.toolchain.outcome }}" \
                   "${{ steps.plan.outcome }}" "${{ steps.build.outcome }}" "${{ steps.preserve.outcome }}" \
                   "${{ steps.guards.outcome }}"; do
            test "$o" = success || { echo "a required step is $o"; exit 1; }
          done
          echo "every required step succeeded"
