name: PR 997 canonical publication regeneration (temporary)

on:
  push:
    branches:
      - correction/dimension-scope-20261029
    paths:
      - .github/workflows/rebuild-pr997-temporary.yml

permissions:
  contents: write

jobs:
  rebuild:
    name: Canonical build / provenance / PDF QA
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install canonical publication dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          pandoc --version | head -1
          xelatex --version | head -1
      - name: Build affected papers and complete book with repository recipe
        shell: bash
        run: |
          set -euo pipefail
          sh ./build.sh Complexity SM GR Substratum Explainer 2>&1 | tee /tmp/pr997-papers-build.log
          sh ./build.sh --book 2>&1 | tee /tmp/pr997-book-build.log
          ! grep -E '(Missing character|build: FAILED|PDF FAILED|TEX FAILED)' /tmp/pr997-papers-build.log /tmp/pr997-book-build.log
          python3 tools/staleness_check.py | tee /tmp/pr997-staleness.log
          grep -q 'staleness_check: OK' /tmp/pr997-staleness.log
      - name: PDF page, density, text, and chapter QA
        shell: bash
        run: |
          set -euo pipefail
          for path in papers/Complexity.pdf papers/SM.pdf papers/GR.pdf papers/Substratum.pdf papers/Explainer.pdf book/The-Incompleteness-of-Observation-FULL.pdf; do
            echo "PDF: $path"
            pdfinfo "$path" | grep -E '^Pages:|^Page size:|^File size:'
            pdftotext -layout "$path" - | python3 -c 'import sys,statistics; t=sys.stdin.read(); pages=t.split(chr(12)); counts=[len(p.strip()) for p in pages if p.strip()]; print("page-text-density:", len(counts), "pages, median", statistics.median(counts), "characters; min", min(counts)); assert len(counts)>15 and statistics.median(counts)>100, "suspicious sparse pages"'
          done
          python3 tools/mirror_check.py
      - name: Verify branch lease, commit only regenerated artifacts, and remove this temporary workflow
        shell: bash
        env:
          BRANCH: correction/dimension-scope-20261029
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || { echo 'ABORT: branch moved while building'; exit 1; }
          git rm .github/workflows/rebuild-pr997-temporary.yml
          git add papers/Complexity.tex papers/Complexity.pdf papers/SM.tex papers/SM.pdf papers/GR.tex papers/GR.pdf papers/Substratum.tex papers/Substratum.pdf papers/Explainer.tex papers/Explainer.pdf book/The-Incompleteness-of-Observation-FULL.tex book/The-Incompleteness-of-Observation-FULL.pdf
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild #997 publication artifacts canonically after #1000"
          git push origin "HEAD:refs/heads/$BRANCH"
