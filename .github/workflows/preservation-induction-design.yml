name: preservation induction research design

# This workflow belongs to the separate design branch, not prospective adoption.
# It neither designates F nor executes a native round.
on:
  push:
    branches: [research/preservation-induction-design-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic dependency
        run: python -m pip install sympy==1.14.0
      - name: Replay independent exact controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          p = Path('verification/programmes/oi-qm/reconstruction/preservation-induction-design')
          subprocess.run(['sha256sum', '-c', 'SHA256SUMS'], cwd=p, check=True)
          for script, saved in [('exact_check.py', 'exact-output.txt'), ('independent_check.py', 'independent-output.txt')]:
              r = subprocess.run([sys.executable, '-I', '-B', str(p / script)], capture_output=True, check=True)
              if r.stderr or r.stdout != (p / saved).read_bytes():
                  raise SystemExit(f'Failed saved-output comparison: {script}')
              print(r.stdout.decode(), end='')
          PY
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore adopted library cache
        uses: actions/cache/restore@v4
        with:
          path: verification/lean-mathlib/.lake/build
          key: oibridge-${{ runner.os }}-${{ hashFiles('verification/lean-mathlib/lean-toolchain', 'verification/lean-mathlib/lake-manifest.json', 'verification/lean-mathlib/lakefile.toml') }}-${{ hashFiles('verification/lean-mathlib/OIBridge.lean', 'verification/lean-mathlib/OIBridge/**/*.lean') }}
          restore-keys: oibridge-${{ runner.os }}-${{ hashFiles('verification/lean-mathlib/lean-toolchain', 'verification/lean-mathlib/lake-manifest.json', 'verification/lean-mathlib/lakefile.toml') }}-
      - name: Compile the research-only design
        working-directory: verification/lean-mathlib
        run: |
          lake exe cache get
          lake --rehash build OIBridge.ImplementationLocality
          lake env lean ../programmes/oi-qm/reconstruction/preservation-induction-design/PreservationInduction.lean
      - name: Check retained records and artifact placement
        run: |
          revision=$(git rev-parse HEAD)
          python3 tools/legacy_records_check.py "$revision"
          python3 tools/v3_verifier.py --receipts "$revision"
          python3 tools/artifact_placement_check.py
