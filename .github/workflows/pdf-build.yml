name: PDF build

# Build-only PDF regeneration from an identified commit (owner decision #1169 c.7182307169). workflow_dispatch
# only: there is no push or pull_request trigger, so no push launches it, and dispatching it needs owner approval
# (AGENTS.md §A.43 item 4). It commits and pushes nothing (contents: read; checkout without persisted credentials).
# It is independent of the A1 trial machinery: it reads no plan, ledger or trial record, runs no checker of the A1
# plan, and neither it nor its dispatch is an A1 trial (§A.50 item 2); it only rebuilds manuscript PDFs.
#
# Inputs: `commit`, a full 40-hex commit id; `targets`, the arguments to build.sh, either `--book` alone or one or
# more paper names from the allowlist below (space-separated, no repeats; any other character, a newline included, is
# refused). It checks out exactly `commit`, installs pandoc 3.1.3 (pinned .deb, sha256-checked) and TeX Live's xelatex
# on ubuntu-24.04 with versions recorded and checked, and runs `sh ./build.sh <targets>` with ALLOW_MISSING_GLYPHS=0,
# so a dropped glyph fails the build. Each rebuilt .tex must equal the committed .tex, so each PDF corresponds to the
# committed source, and the build may change no other path. For each PDF it records its SHA-256, its source commit,
# the page count (pdfinfo) and the median number of non-whitespace characters per page (pdftotext); a median below
# 1000 fails (the committed PDFs lie between about 1800 and 2700; a document typeset into a narrow column falls far
# below). The SHA-256 values identify this run's output; they are not reproducible content hashes, since apt package
# versions are recorded but not pinned and SOURCE_DATE_EPOCH is not set.
#
# Every run step writes its exit status to out/<step>.rc. result.json (schema `pdf-build-v1`, §A.44) records the
# inputs, the run identity, the toolchain and package versions, each step's outcome and exit status, the TeX files
# that differ and the per-PDF hashes and statistics, read from files the steps write, never from log text.
# result.json, SHA256SUMS, the logs and the PDFs (under pdf/, at their repository paths) are uploaded as the artifact
# `pdf-build-<run id>`, also when input validation fails; the commit is in result.json. No step continues on error
# and nothing is retried; the last step fails unless every required step succeeded.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "the commit to build, in full (40 lowercase hex)"
        required: true
        type: string
      targets:
        description: "build.sh arguments: --book, or paper names (e.g. SM GR)"
        required: true
        type: string

permissions:
  contents: read

env:
  COMMIT: ${{ inputs.commit }}
  TARGETS: ${{ inputs.targets }}
  PAPERS: "Bioinformatics Complexity Computation GR Introduction Juno Main Medicine Methodology SM Structure Substratum"
  BOOK: book/The-Incompleteness-of-Observation-FULL
  PANDOC_DEB: https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
  PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc
  MIN_MEDIAN_CHARS: '1000'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Inputs are a full commit id and allowlisted targets; this is the first attempt
        id: inputs
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          (
            set -e
            test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "re-runs are refused; dispatch afresh"; exit 1; }
            re_commit='^[0-9a-f]{40}$'; re_targets='^[A-Za-z -]+$'
            [[ "$COMMIT" =~ $re_commit ]] || { echo "commit is not a full commit id"; exit 1; }
            [[ "$TARGETS" =~ $re_targets ]] || { echo "targets may hold only letters, spaces and hyphens"; exit 1; }
            read -r -a t <<< "$TARGETS"
            test "${#t[@]}" -ge 1 || { echo "no targets"; exit 1; }
            : > "$RUNNER_TEMP/out/outputs.txt"
            if [ "${t[*]}" = "--book" ]; then
              echo "$BOOK" >> "$RUNNER_TEMP/out/outputs.txt"
            else
              for n in "${t[@]}"; do
                [[ " $PAPERS " == *" $n "* ]] || { echo "target not allowed: $n"; exit 1; }
                ! grep -qx "papers/$n" "$RUNNER_TEMP/out/outputs.txt" || { echo "repeated target: $n"; exit 1; }
                echo "papers/$n" >> "$RUNNER_TEMP/out/outputs.txt"
              done
            fi
            echo "commit $COMMIT; targets: ${t[*]}"
          ) > "$RUNNER_TEMP/out/inputs.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/inputs.log"; echo "$rc" > "$RUNNER_TEMP/out/inputs.rc"; exit "$rc"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        id: checkout
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: The checkout is exactly the commit, clean
        id: head
        run: |
          set +e
          (
            set -e
            test "$(git rev-parse HEAD)" = "$COMMIT"
            test -z "$(git status --porcelain --ignored)"
            echo "HEAD $COMMIT, clean"
          ) > "$RUNNER_TEMP/out/head.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/head.log"; echo "$rc" > "$RUNNER_TEMP/out/head.rc"; exit "$rc"

      - name: Toolchain (pandoc 3.1.3, xelatex, poppler), versions recorded and checked
        id: toolchain
        run: |
          set +e
          (
            set -e
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended \
              texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
            curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "$PANDOC_DEB"
            echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
            sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
            {
              echo "image $ImageOS $ImageVersion"
              pandoc --version | head -1
              xelatex --version | head -1
              pdfinfo -v 2>&1 | head -1
              python3 --version
              dpkg-query -W -f '${Package} ${Version}\n' texlive-xetex texlive-latex-recommended texlive-latex-extra \
                texlive-fonts-recommended lmodern poppler-utils
            } > "$RUNNER_TEMP/out/toolchain-versions.txt"
            dpkg-query -W -f '${Package} ${Version}\n' 'texlive-*' tex-common lmodern 'fonts-*' 'poppler-*' 'libpoppler*' \
              2>/dev/null | sort > "$RUNNER_TEMP/out/toolchain-packages.txt" || true
            test -s "$RUNNER_TEMP/out/toolchain-packages.txt"
            cat "$RUNNER_TEMP/out/toolchain-versions.txt"
            test "$ImageOS" = ubuntu24
            test "$(pandoc --version | head -1)" = "pandoc 3.1.3"
            [[ "$(dpkg-query -W -f '${Version}' texlive-xetex)" == 2023.* ]]
            [[ "$(dpkg-query -W -f '${Version}' poppler-utils)" == 24.* ]]
          ) > "$RUNNER_TEMP/out/toolchain.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/toolchain.log"; echo "$rc" > "$RUNNER_TEMP/out/toolchain.rc"; exit "$rc"

      - name: sh ./build.sh <targets>
        id: build
        env:
          ALLOW_MISSING_GLYPHS: '0'
        run: |
          set +e
          read -r -a t <<< "$TARGETS"
          sh ./build.sh "${t[@]}" > "$RUNNER_TEMP/out/build.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/build.log"; echo "$rc" > "$RUNNER_TEMP/out/build.rc"; exit "$rc"

      - name: Each rebuilt .tex equals the committed .tex; nothing else changed
        id: texcheck
        run: |
          set +e
          (
            set -e
            : > "$RUNNER_TEMP/out/tex-diff.txt"
            while read -r o; do
              git ls-files --error-unmatch "$o.tex" > /dev/null 2>&1 || echo "$o.tex" >> "$RUNNER_TEMP/out/tex-diff.txt"
              git diff --quiet -- "$o.tex" || echo "$o.tex" >> "$RUNNER_TEMP/out/tex-diff.txt"
              test -s "$o.pdf"
            done < "$RUNNER_TEMP/out/outputs.txt"
            sed -e 's/$/.tex/' -e 'p' -e 's/\.tex$/.pdf/' "$RUNNER_TEMP/out/outputs.txt" > "$RUNNER_TEMP/out/expected-paths.txt"
            git status --porcelain --untracked-files=all | cut -c4- \
              | { grep -v -x -F -f "$RUNNER_TEMP/out/expected-paths.txt" || true; } > "$RUNNER_TEMP/out/other-changes.txt"
            cat "$RUNNER_TEMP/out/tex-diff.txt" "$RUNNER_TEMP/out/other-changes.txt"
            test ! -s "$RUNNER_TEMP/out/tex-diff.txt"
            test ! -s "$RUNNER_TEMP/out/other-changes.txt"
            while read -r o; do mkdir -p "$RUNNER_TEMP/out/pdf/$(dirname "$o")"; cp "$o.pdf" "$RUNNER_TEMP/out/pdf/$o.pdf"; done \
              < "$RUNNER_TEMP/out/outputs.txt"
            (cd "$RUNNER_TEMP/out/pdf" && sed 's/$/.pdf/' "$RUNNER_TEMP/out/outputs.txt" | xargs sha256sum > "$RUNNER_TEMP/out/SHA256SUMS")
            cat "$RUNNER_TEMP/out/SHA256SUMS"
            echo "every rebuilt .tex equals the committed .tex"
          ) > "$RUNNER_TEMP/out/texcheck.log" 2>&1
          rc=$?; cat "$RUNNER_TEMP/out/texcheck.log"; echo "$rc" > "$RUNNER_TEMP/out/texcheck.rc"; exit "$rc"

      - name: Page counts and median characters per page; each median at least MIN_MEDIAN_CHARS
        id: stats
        run: |
          set +e
          python3 -I -B - > "$RUNNER_TEMP/out/stats.log" 2>&1 <<'PY'
          import hashlib, json, os, statistics, subprocess, sys
          out = os.path.join(os.environ['RUNNER_TEMP'], 'out')
          floor = int(os.environ['MIN_MEDIAN_CHARS'])
          stats, ok = {}, True
          for o in open(os.path.join(out, 'outputs.txt')).read().split():
              f = o + '.pdf'
              info = subprocess.run(['pdfinfo', f], capture_output=True, text=True, check=True).stdout
              pages = int(next(l.split()[1] for l in info.splitlines() if l.startswith('Pages:')))
              text = subprocess.run(['pdftotext', '-enc', 'UTF-8', f, '-'], capture_output=True, text=True,
                                    check=True).stdout.split('\f')[:pages]
              chars = [sum(not c.isspace() for c in p) for p in text] + [0] * (pages - len(text))
              median = statistics.median(chars)
              sha = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              stats[f] = {'source_commit': os.environ['COMMIT'], 'sha256': sha, 'pages': pages, 'median_chars_per_page': median, 'plausible': median >= floor}
              ok = ok and median >= floor
          json.dump(stats, open(os.path.join(out, 'pdf-stats.json'), 'w'), indent=1, sort_keys=True)
          print(json.dumps(stats, indent=1, sort_keys=True))
          sys.exit(0 if ok else 1)
          PY
          rc=$?; cat "$RUNNER_TEMP/out/stats.log"; echo "$rc" > "$RUNNER_TEMP/out/stats.rc"; exit "$rc"

      - name: Write result.json
        id: result
        if: ${{ always() }}
        env:
          OUTCOMES: >-
            {"inputs": "${{ steps.inputs.outcome }}", "checkout": "${{ steps.checkout.outcome }}",
             "head": "${{ steps.head.outcome }}", "toolchain": "${{ steps.toolchain.outcome }}",
             "build": "${{ steps.build.outcome }}", "texcheck": "${{ steps.texcheck.outcome }}",
             "stats": "${{ steps.stats.outcome }}"}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I -B - <<'PY'
          import json, os
          out = os.path.join(os.environ['RUNNER_TEMP'], 'out')

          def read(name):
              p = os.path.join(out, name)
              return open(p, encoding='utf-8', errors='replace').read() if os.path.exists(p) else None
          steps = {}
          for name, outcome in json.loads(os.environ['OUTCOMES']).items():
              rc = read(name + '.rc')
              steps[name] = {'outcome': outcome, 'exit_status': int(rc.strip()) if rc is not None else None}
          tex_diff, stats = read('tex-diff.txt'), read('pdf-stats.json')
          result = {'schema': 'pdf-build-v1', 'commit': os.environ['COMMIT'], 'targets': os.environ['TARGETS'].split(),
                    'outputs': (read('outputs.txt') or '').split(),
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'], 'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
                    'toolchain_versions': (read('toolchain-versions.txt') or '').splitlines(),
                    'toolchain_packages': (read('toolchain-packages.txt') or '').splitlines(),
                    'steps': steps,
                    'tex_files_differing': None if tex_diff is None else tex_diff.split(),
                    'other_changes': None if read('other-changes.txt') is None else read('other-changes.txt').splitlines(),
                    'min_median_chars_per_page': int(os.environ['MIN_MEDIAN_CHARS']),
                    'pdf_stats': None if stats is None else json.loads(stats),
                    'pdf_sha256': None if stats is None else {f: v['sha256'] for f, v in json.loads(stats).items()},
                    'verdict': 'pass' if all(s['outcome'] == 'success' for s in steps.values()) else 'fail'}
          json.dump(result, open(os.path.join(out, 'result.json'), 'w'), indent=1, sort_keys=True)
          print(json.dumps(result, indent=1, sort_keys=True))
          PY

      - name: Upload result.json, logs and the PDFs
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pdf-build-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

      - name: Every required step succeeded (a skipped step fails)
        if: ${{ always() }}
        env:
          O: >-
            ${{ steps.inputs.outcome }} ${{ steps.checkout.outcome }} ${{ steps.head.outcome }}
            ${{ steps.toolchain.outcome }} ${{ steps.build.outcome }} ${{ steps.texcheck.outcome }}
            ${{ steps.stats.outcome }} ${{ steps.result.outcome }} ${{ steps.upload.outcome }}
        run: |
          read -r -a o <<< "$O"
          test "${#o[@]}" = 9 || { echo "a required step outcome is missing"; exit 1; }
          for s in "${o[@]}"; do test "$s" = success || { echo "a required step is $s"; exit 1; }; done
          echo "every required step succeeded"
