name: Project board (read / Status update)

# #1079. Reads the OI Research Programme board (users/amaybaum/projects/3) and, in write mode,
# changes one card's Status with compare-and-set and readback (tools/project_board.py).
# workflow_dispatch only: there is no push, pull_request or schedule trigger, so the secret is
# never exposed to a fork and no push launches it. Each dispatch is a special launch that needs
# the owner's approval of its exact inputs (AGENTS.md §A.43 item 4). The board shows tracking
# only; Issues hold planning status and authorization (§A.45). The verdict is the job's exit
# status and the JSON artifact (§A.44). Actions are pinned by commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read (default) or write"
        required: true
        default: read
        type: choice
        options: [read, write]
      number:
        description: "write: the Issue or PR number of the card"
        required: false
        default: ""
      expected:
        description: "write: the card's current Status (compare-and-set; '(none)' for no Status)"
        required: false
        default: ""
      status:
        description: "write: the new Status (must be an existing option)"
        required: false
        default: ""
      apply:
        description: "write: actually write (false = dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Self-test (no network)
        run: python3 -I -B tools/project_board.py --self-test
      - name: Read or update the board
        env:
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          MODE: ${{ inputs.mode }}
          NUMBER: ${{ inputs.number }}
          EXPECTED: ${{ inputs.expected }}
          STATUS: ${{ inputs.status }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -eu
          if [ "$MODE" = read ]; then
            python3 -I -B tools/project_board.py read --out out
          else
            case "$NUMBER" in ''|*[!0-9]*) echo "FAIL: number must be digits"; exit 1;; esac
            set -- write --out out --number "$NUMBER" --expected "$EXPECTED" --status "$STATUS"
            if [ "$APPLY" = true ]; then set -- "$@" --apply; fi
            python3 -I -B tools/project_board.py "$@"
          fi
      - name: Upload the board record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: project-board-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 90
