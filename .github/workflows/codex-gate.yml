name: codex-gate

# TEMPORARILY DISABLED.
#
# Codex code review is metered and the repository's deterministic verification already runs
# independently in verify.yml. Keep this workflow and, crucially, keep the existing required
# check name so the branch ruleset does not leave pull requests permanently "Expected" while
# Codex review is paused. Re-enable the exact-head/thread gate by restoring the prior implementation.
#
# This workflow does not call Codex, inspect Codex reviews, poll, or consume Codex review quota.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex review complete
    runs-on: ubuntu-latest
    steps:
      - name: Codex gate temporarily disabled
        run: |
          echo "Codex review gate is temporarily disabled; deterministic verification remains required."
