name: codex-gate

# A required status check whose only job is to answer one question: has Codex reviewed THIS head
# commit, and is anything it raised still open?
#
# Native Codex publishes no check run and no commit status, and its reviews are always COMMENTED,
# never APPROVED, from an app with author_association NONE. So there is nothing for a branch rule to
# require, and a pull request goes green on CI and becomes mergeable in the five to seven minutes
# before Codex has looked at the head commit at all. This job is the missing name: require
# "Codex review complete" on main alongside the three verify jobs and that window closes.
#
# It gates PROCESS, not verdict. It asks whether a review exists for the exact head SHA and whether
# any thread Codex opened is still unresolved. It does NOT ask whether Codex was happy: a
# nondeterministic reviewer must never hold a merge veto on the content of its findings, only on
# whether they have been looked at. Deterministic checks belong in verify.yml.
#
# NO PATH FILTERS, for the same reason verify.yml has none: a required check that never runs never
# reports, and GitHub leaves it Expected forever.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to check (workflow_dispatch has no pull_request payload)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex review complete
    runs-on: ubuntu-latest
    # Long enough to cover the observed lag (five to seven minutes across six pushes) with margin,
    # short enough that a genuinely absent review fails the same working session.
    timeout-minutes: 25
    steps:
      - name: Wait for a Codex review of this exact head, then check the threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # workflow_dispatch carries no pull_request payload, so both fall back to the input and
          # the head SHA is looked up below rather than read from the event.
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: chatgpt-codex-connector
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${PR:-}" ]; then
            echo "::error::No pull request number. On workflow_dispatch, pass the 'pr' input."
            exit 1
          fi
          if [ -z "${HEAD_SHA:-}" ]; then
            HEAD_SHA="$(gh api "repos/${OWNER}/${REPO}/pulls/${PR}" --jq .head.sha)"
            echo "Resolved head of #${PR} to ${HEAD_SHA}."
          fi

          # A dispatched run attaches its check run to GITHUB_SHA -- the tip of the ref it was
          # launched on -- not to whatever this script chooses to query. Dispatched from the default
          # branch, it would go green against main's commit and leave the pull request's required
          # check untouched, which is worse than failing: it looks like the gate passed. Refuse.
          # (The comparison is dispatch-only: on pull_request, GITHUB_SHA is the merge commit and
          # differs from head.sha by design.)
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::This run is attached to ${GITHUB_SHA}, but #${PR}'s head is ${HEAD_SHA}." \
                 "A green result here could not clear the required check. Re-run the original" \
                 "pull_request run instead, or dispatch with --ref set to the head branch."
            exit 1
          fi

          # One GraphQL round trip returns both halves: the reviews with the commit each looked at,
          # and the threads with their resolution and outdated flags.
          query() {
            gh api graphql -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    reviews(last:50) {
                      nodes { author { login } commit { oid } }
                    }
                    reviewThreads(last:100) {
                      nodes {
                        isResolved
                        isOutdated
                        comments(first:1) { nodes { author { login } } }
                      }
                    }
                  }
                }
              }' -F owner="$OWNER" -F repo="$REPO" -F pr="$PR"
          }

          # A thread counts against the gate only if Codex opened it, it is unresolved, and it is
          # NOT outdated. Outdated threads are ones a later push superseded; on this repository four
          # of five went outdated the moment a fix landed, and counting those would wedge the branch
          # on stale findings that no longer refer to live code.
          for attempt in $(seq 1 24); do
            json="$(query)"

            reviewed="$(jq -r --arg who "$REVIEWER" --arg sha "$HEAD_SHA" '
              [ .data.repository.pullRequest.reviews.nodes[]
                | select(.author.login == $who and .commit.oid == $sha) ] | length' <<<"$json")"

            open_threads="$(jq -r --arg who "$REVIEWER" '
              [ .data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false and .isOutdated == false)
                | select(.comments.nodes[0].author.login == $who) ] | length' <<<"$json")"

            if [ "$reviewed" -gt 0 ]; then
              echo "Codex has reviewed ${HEAD_SHA}."
              if [ "$open_threads" -gt 0 ]; then
                # RESOLVING the thread is what clears this, and nothing else. A reply leaves
                # isResolved false, so an instruction to "reply saying why not" would leave the gate
                # red forever; and counting any reply as acknowledgement would let a one-word answer
                # satisfy it, which is not a gate. Disagreeing with a finding is legitimate — reply
                # with the reason AND resolve, so the thread carries the record and the branch moves.
                echo "::error::${open_threads} unresolved, non-outdated Codex thread(s) on this head." \
                     "Resolve each one. If you are rejecting a finding, reply with the reason and" \
                     "resolve it anyway — a reply alone does not clear this check."
                exit 1
              fi
              echo "No unresolved, non-outdated Codex threads. Gate satisfied."
              exit 0
            fi

            echo "Attempt ${attempt}/24: no Codex review of ${HEAD_SHA} yet; waiting 60s."
            sleep 60
          done

          echo "::error::No Codex review of ${HEAD_SHA} after 24 minutes." \
               "Comment '@codex review' on the pull request, then re-run this check."
          exit 1
